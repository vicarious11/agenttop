name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install hatch

      - name: Build package
        run: hatch build

      - name: Publish to PyPI
        env:
          HATCH_INDEX_USER: __token__
          HATCH_INDEX_AUTH: ${{ secrets.PYPI_TOKEN }}
        run: hatch publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*

      - name: Update Homebrew formula SHA256
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "Processing release: $VERSION"

          # Download the release tarball from GitHub
          wget -q "https://github.com/${{ github.repository }}/archive/refs/tags/${VERSION}.tar.gz" -O /tmp/release.tar.gz

          # Calculate SHA256
          SHA256=$(shasum -a 256 /tmp/release.tar.gz | awk '{print $1}')
          echo "Calculated SHA256: $SHA256"

          # Update the formula
          sed -i "s/sha256 \".*\"/sha256 \"${SHA256}\"/" homebrew/Formula/agenttop.rb

          # Verify the update
          grep "sha256" homebrew/Formula/agenttop.rb

          # Configure git and commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add homebrew/Formula/agenttop.rb
          git commit -m "chore: update Homebrew formula SHA256 for ${VERSION}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
