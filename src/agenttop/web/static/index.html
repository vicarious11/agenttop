<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>agenttop — AI Usage Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  <link rel="stylesheet" href="/static/css/theme.css">
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-scan"></div>
  <div class="bg-vignette"></div>

  <!-- Top Bar -->
  <header id="topbar">
    <div class="logo">
      <div class="logo-glyph">
        <svg width="28" height="28" viewBox="0 0 28 28">
          <polygon points="14,2 26,8 26,20 14,26 2,20 2,8" fill="none" stroke="#2dd4bf" stroke-width="1.5" class="logo-hex-spin"/>
          <circle cx="14" cy="14" r="4" fill="#2dd4bf" class="logo-core"/>
        </svg>
      </div>
      <span class="logo-text">agent<span class="accent">top</span></span>
      <span class="logo-tag">v0.1</span>
    </div>

    <div id="stats-ribbon" class="stats-ribbon"></div>

    <div class="topbar-right">
      <div class="live-indicator">
        <span class="live-dot"></span>
        <span class="live-text">LIVE</span>
      </div>
      <select id="time-range" class="neon-select">
        <option value="1">Today</option>
        <option value="7">7 Days</option>
        <option value="30" selected>30 Days</option>
        <option value="0">All Time</option>
      </select>
    </div>
  </header>

  <!-- Tab Bar -->
  <nav id="tab-bar" class="tab-bar">
    <button class="tab-btn active" data-tab="overview">
      <span class="tab-icon">◈</span> Overview
    </button>
    <button class="tab-btn" data-tab="sessions">
      <span class="tab-icon">▣</span> Sessions
      <span class="tab-badge" id="tab-badge-sessions"></span>
    </button>
    <button class="tab-btn" data-tab="analyze">
      <span class="tab-icon">⚡</span> Analyze
      <span class="tab-badge" id="tab-badge-analyze"></span>
    </button>
  </nav>

  <!-- Tab: Overview (graph + panels) -->
  <main id="main" class="tab-pane active" data-pane="overview">
    <div id="graph-container" class="glass-panel">
      <div class="panel-header">
        <div class="panel-title"><span class="panel-icon">◈</span> Knowledge Graph</div>
        <div class="graph-legend" id="graph-legend"></div>
      </div>
      <div id="graph-area"><svg id="graph-svg"></svg></div>
    </div>

    <div id="data-column">
      <div id="model-panel" class="glass-panel mini-panel">
        <div class="panel-header">
          <div class="panel-title"><span class="panel-icon">⬡</span> Model Usage</div>
          <div class="model-legend"><span class="ml-dot ml-input"></span>In <span class="ml-dot ml-output"></span>Out</div>
        </div>
        <div id="model-content" class="panel-body"></div>
      </div>

      <div id="hourly-panel" class="glass-panel mini-panel">
        <div class="panel-header">
          <div class="panel-title"><span class="panel-icon">◰</span> Hourly Activity</div>
          <div id="hourly-total" class="panel-badge"></div>
        </div>
        <div id="hourly-content" class="panel-body"></div>
      </div>

      <div id="daily-cost-panel" class="glass-panel mini-panel">
        <div class="panel-header">
          <div class="panel-title"><span class="panel-icon">◱</span> Daily Cost</div>
          <div id="daily-cost-summary" class="panel-badge"></div>
        </div>
        <div id="daily-cost-content" class="panel-body"></div>
      </div>

      <div id="cost-panel" class="glass-panel mini-panel">
        <div class="panel-header">
          <div class="panel-title"><span class="panel-icon">◇</span> Cost Breakdown</div>
          <div id="cost-total-badge" class="panel-badge cost-badge"></div>
        </div>
        <div id="cost-content" class="panel-body"></div>
      </div>

      <div id="activity-panel" class="glass-panel mini-panel">
        <div class="panel-header">
          <div class="panel-title"><span class="panel-icon">◧</span> Activity</div>
          <div id="oneshot-badge" class="panel-badge"></div>
        </div>
        <div id="activity-content" class="panel-body"></div>
      </div>

      <div id="project-cost-panel" class="glass-panel mini-panel">
        <div class="panel-header">
          <div class="panel-title"><span class="panel-icon">◇</span> Cost by Project</div>
        </div>
        <div id="project-cost-content" class="panel-body"></div>
      </div>

    </div>
  </main>

  <!-- Tab: Sessions (full-page browser) -->
  <div id="pane-sessions" class="tab-pane" data-pane="sessions"></div>

  <!-- Tab: Analyze (full-page analysis) -->
  <div id="pane-analyze" class="tab-pane" data-pane="analyze"></div>

  <!-- Node Detail Overlay -->
  <aside id="node-detail" class="glass-panel detail-overlay hidden">
    <div class="panel-header">
      <div class="panel-title"><span class="panel-icon">▣</span> Node Detail</div>
      <button id="detail-close" class="icon-btn">&times;</button>
    </div>
    <div id="detail-content"></div>
  </aside>

  <!-- Tool Bar -->
  <div id="tool-bar" class="tool-bar"></div>

  <!-- Tooltip -->
  <div id="tooltip" class="tooltip"></div>

  <script src="/static/js/app.js"></script>
  <script src="/static/js/graph.js"></script>
  <script src="/static/js/stats.js"></script>
  <script src="/static/js/panels.js"></script>
  <script src="/static/js/session-explorer.js"></script>
  <script src="/static/js/optimizer.js"></script>
</body>
</html>
