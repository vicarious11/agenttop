<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>agenttop — AI Agent Command Center</title>

  <meta property="og:title" content="agenttop — htop for AI Coding Agents">
  <meta property="og:description" content="Monitor all your AI coding agents in one neon-cyberpunk dashboard. Token usage, costs, sessions, model breakdown — all in real time.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <style>
/* ═══════════════════════════════════════════════════════════
   agenttop — Neon Cyberpunk Demo
   ═══════════════════════════════════════════════════════════ */
:root {
  --neon-cyan: #00fff5;
  --neon-orange: #ff6b00;
  --neon-magenta: #ff00ff;
  --neon-green: #00ff88;
  --neon-blue: #4488ff;
  --neon-yellow: #ffee00;
  --neon-purple: #6644ff;
  --neon-red: #ff4444;
  --neon-white: #e0e0ff;
  --bg-deep: #050508;
  --bg-dark: #0a0a10;
  --bg-panel: rgba(12, 12, 22, 0.85);
  --bg-card: rgba(18, 18, 32, 0.65);
  --bg-hover: rgba(255, 255, 255, 0.03);
  --border-dim: rgba(255, 255, 255, 0.04);
  --border-subtle: rgba(255, 255, 255, 0.07);
  --border-glow: rgba(0, 255, 245, 0.15);
  --text-primary: #d8d8e8;
  --text-secondary: #7777a0;
  --text-dim: #44445a;
  --font-mono: 'SF Mono', 'Fira Code', 'JetBrains Mono', 'Cascadia Code', monospace;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --panel-radius: 10px;
  --ease-out: cubic-bezier(0.25, 0.46, 0.45, 0.94);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  height: 100%; background: var(--bg-deep); color: var(--text-primary);
  font-family: var(--font-sans); font-size: 13px; overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
.bg-grid {
  position: fixed; inset: 0;
  background: linear-gradient(rgba(0,255,245,0.025) 1px, transparent 1px),
              linear-gradient(90deg, rgba(0,255,245,0.025) 1px, transparent 1px);
  background-size: 50px 50px; pointer-events: none; z-index: 0;
  animation: grid-drift 20s linear infinite;
}
@keyframes grid-drift { 0% { transform: translate(0,0); } 100% { transform: translate(50px,50px); } }
.bg-scan { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.bg-scan::after {
  content: ''; position: absolute; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, rgba(0,255,245,0.08), rgba(0,255,245,0.15), rgba(0,255,245,0.08), transparent);
  animation: scan-line 8s linear infinite;
}
@keyframes scan-line { 0% { top: -2px; } 100% { top: 100%; } }
.bg-vignette {
  position: fixed; inset: 0;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(5,5,8,0.7) 100%);
  pointer-events: none; z-index: 0;
}
.glass-panel {
  background: var(--bg-panel); backdrop-filter: blur(16px) saturate(140%);
  -webkit-backdrop-filter: blur(16px) saturate(140%);
  border: 1px solid var(--border-subtle); border-radius: var(--panel-radius);
  position: relative; overflow: hidden;
}
.glass-panel::before {
  content: ''; position: absolute; top: 0; left: 20%; right: 20%; height: 1px;
  background: linear-gradient(90deg, transparent, var(--border-glow), transparent); z-index: 1;
}
.panel-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 12px; border-bottom: 1px solid var(--border-dim);
}
.panel-title {
  display: flex; align-items: center; gap: 6px; font-size: 10px;
  font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-secondary);
}
.panel-icon { color: var(--neon-cyan); font-size: 12px; filter: drop-shadow(0 0 4px var(--neon-cyan)); }
.panel-body { padding: 8px 12px; }
.panel-badge { font-size: 9px; font-family: var(--font-mono); color: var(--text-dim); letter-spacing: 0.5px; }

/* ── TOP BAR ── */
#topbar {
  display: flex; align-items: center; gap: 20px; padding: 8px 16px;
  background: rgba(8,8,14,0.95); border-bottom: 1px solid var(--border-dim);
  z-index: 100; position: relative;
}
#topbar::after {
  content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,107,0,0.3) 20%, rgba(0,255,245,0.3) 50%, rgba(255,0,255,0.3) 80%, transparent);
}
.logo { display: flex; align-items: center; gap: 10px; white-space: nowrap; flex-shrink: 0; }
.logo-glyph { animation: logo-pulse 4s ease-in-out infinite; }
.logo-hex-spin { transform-origin: 14px 14px; animation: hex-rotate 30s linear infinite; }
.logo-core { animation: core-pulse 2s ease-in-out infinite; }
@keyframes logo-pulse { 0%,100% { filter: drop-shadow(0 0 4px rgba(255,107,0,0.4)); } 50% { filter: drop-shadow(0 0 12px rgba(255,107,0,0.8)); } }
@keyframes hex-rotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
@keyframes core-pulse { 0%,100% { opacity: 0.8; } 50% { opacity: 1; } }
.logo-text { font-size: 16px; font-weight: 700; font-family: var(--font-mono); color: var(--text-primary); letter-spacing: -0.5px; }
.logo-text .accent { color: var(--neon-orange); text-shadow: 0 0 8px rgba(255,107,0,0.5), 0 0 16px rgba(255,107,0,0.2); }
.logo-tag { font-size: 8px; font-family: var(--font-mono); color: var(--text-dim); border: 1px solid var(--border-dim); padding: 1px 4px; border-radius: 3px; letter-spacing: 0.5px; }

/* ── Stats Ribbon ── */
.stats-ribbon { display: flex; gap: 6px; flex: 1; justify-content: center; overflow-x: auto; scrollbar-width: none; }
.stats-ribbon::-webkit-scrollbar { display: none; }
.stat-card {
  display: flex; flex-direction: column; align-items: center; padding: 4px 12px;
  border-radius: 6px; background: rgba(255,255,255,0.02); border: 1px solid var(--border-dim);
  min-width: 80px; transition: all 0.3s var(--ease-out); position: relative; cursor: default;
}
.stat-card::after { content: ''; position: absolute; bottom: 0; left: 20%; right: 20%; height: 1px; background: var(--neon-cyan); opacity: 0; transition: opacity 0.3s; }
.stat-card:hover { border-color: rgba(0,255,245,0.2); background: rgba(0,255,245,0.03); }
.stat-card:hover::after { opacity: 0.4; }
.stat-value { font-size: 15px; font-weight: 700; font-family: var(--font-mono); line-height: 1.2; transition: transform 0.2s var(--ease-spring), color 0.3s; }
.stat-label { font-size: 8px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-dim); margin-top: 1px; }
.stat-spark { width: 50px; height: 12px; margin-top: 2px; }
.stat-spark path { fill: none; stroke-width: 1.5; opacity: 0.6; }

.topbar-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.live-indicator { display: flex; align-items: center; gap: 5px; }
.live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--neon-green); box-shadow: 0 0 6px var(--neon-green), 0 0 12px rgba(0,255,136,0.3); animation: live-blink 2s ease-in-out infinite; }
@keyframes live-blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
.live-text { font-size: 9px; font-weight: 700; font-family: var(--font-mono); letter-spacing: 2px; color: var(--neon-green); text-shadow: 0 0 6px rgba(0,255,136,0.4); }
.neon-select { background: rgba(255,255,255,0.04); border: 1px solid var(--border-dim); border-radius: 6px; color: var(--text-primary); padding: 4px 8px; font-family: var(--font-mono); font-size: 10px; cursor: pointer; outline: none; }
.neon-select:hover, .neon-select:focus { border-color: var(--neon-cyan); }
.neon-select option { background: #12121e; }

/* ── MAIN LAYOUT ── */
#main {
  display: grid; grid-template-columns: 1fr 360px; gap: 10px; padding: 10px 16px;
  height: calc(100vh - 48px - 34px - 42px); position: relative; z-index: 1;
}
#graph-container { display: flex; flex-direction: column; min-width: 0; }
#graph-area { flex: 1; position: relative; overflow: hidden; }
#graph-svg { width: 100%; height: 100%; display: block; }
.graph-legend { display: flex; gap: 12px; font-size: 9px; }
.legend-item { display: flex; align-items: center; gap: 4px; color: var(--text-dim); letter-spacing: 0.5px; }
.legend-shape { width: 7px; height: 7px; display: inline-block; border: 1px solid currentColor; }
.legend-circle { border-radius: 50%; }
.legend-hex { clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); }
.legend-diamond { transform: rotate(45deg); border-radius: 1px; }
.legend-rect { border-radius: 2px; }

#data-column { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: rgba(0,255,245,0.15) transparent; }
.mini-panel { flex-shrink: 0; }
.sessions-stretch { flex: 1; min-height: 120px; display: flex; flex-direction: column; }
.sessions-stretch .panel-body { flex: 1; overflow-y: auto; }

/* ── MODEL USAGE ── */
.model-legend { display: flex; align-items: center; gap: 4px; font-size: 8px; color: var(--text-dim); letter-spacing: 0.3px; }
.ml-dot { width: 6px; height: 6px; border-radius: 1px; display: inline-block; margin-left: 6px; }
.ml-input { background: var(--neon-cyan); }
.ml-output { background: var(--neon-orange); }
.ml-cache { background: var(--neon-green); }
.model-row { padding: 5px 0; border-bottom: 1px solid var(--border-dim); animation: fade-slide-in 0.3s var(--ease-out) forwards; opacity: 0; }
.model-row:last-child { border-bottom: none; }
.model-row:nth-child(1) { animation-delay: 0s; }
.model-row:nth-child(2) { animation-delay: 0.05s; }
.model-row:nth-child(3) { animation-delay: 0.1s; }
.model-row:nth-child(4) { animation-delay: 0.15s; }
.model-row:nth-child(5) { animation-delay: 0.2s; }
.model-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.model-name { font-family: var(--font-mono); font-size: 11px; font-weight: 600; }
.model-stats { display: flex; gap: 8px; font-family: var(--font-mono); font-size: 10px; }
.model-tokens { color: var(--text-secondary); }
.model-cost { color: var(--neon-orange); }
.model-bar-track { display: flex; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.03); overflow: hidden; }
.model-seg { height: 100%; transition: width 0.6s var(--ease-out); min-width: 0; }
.seg-input { background: var(--neon-cyan); opacity: 0.8; }
.seg-output { background: var(--neon-orange); opacity: 0.8; }
.seg-cache { background: var(--neon-green); opacity: 0.6; }
.model-seg:hover { opacity: 1; }

/* ── HOURLY ── */
.hourly-chart { display: flex; align-items: flex-end; gap: 2px; height: 60px; padding-bottom: 14px; position: relative; }
.hour-col { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; position: relative; }
.hour-bar-wrap { flex: 1; width: 100%; display: flex; align-items: flex-end; }
.hour-bar { width: 100%; background: var(--neon-cyan); border-radius: 2px 2px 0 0; min-height: 1px; transition: height 0.4s var(--ease-out), opacity 0.3s; }
.hour-col:hover .hour-bar { opacity: 1 !important; box-shadow: 0 0 8px var(--neon-cyan); }
.hour-now .hour-bar { background: var(--neon-orange) !important; box-shadow: 0 0 8px rgba(255,107,0,0.5); }
.hour-label { font-size: 7px; font-family: var(--font-mono); color: var(--text-dim); position: absolute; bottom: -2px; letter-spacing: 0.3px; }
.hour-label-spacer { height: 10px; }

/* ── SESSIONS ── */
.sessions-list { display: flex; flex-direction: column; }
.session-row { display: flex; align-items: center; gap: 6px; padding: 4px 0; border-bottom: 1px solid var(--border-dim); font-size: 10px; font-family: var(--font-mono); animation: fade-slide-in 0.25s var(--ease-out) forwards; opacity: 0; transition: background 0.15s; }
.session-row:last-child { border-bottom: none; }
.session-row:hover { background: var(--bg-hover); }
.session-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
.session-project { color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.session-badge { font-size: 8px; padding: 1px 4px; border-radius: 3px; white-space: nowrap; flex-shrink: 0; }
.session-dur { background: rgba(0,255,245,0.08); color: var(--neon-cyan); }
.session-msgs { background: rgba(255,0,255,0.08); color: var(--neon-magenta); }
.session-lines { background: rgba(0,255,136,0.08); color: var(--neon-green); }
.session-tokens { color: var(--neon-cyan); flex-shrink: 0; min-width: 36px; text-align: right; }
.session-time { color: var(--text-dim); flex-shrink: 0; min-width: 32px; text-align: right; font-size: 9px; }

/* ── COST ── */
.cost-badge { color: var(--neon-orange) !important; font-weight: 600; }
.cost-summary { display: flex; gap: 12px; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border-dim); }
.cost-sum-item { display: flex; flex-direction: column; align-items: center; flex: 1; }
.cost-sum-val { font-size: 14px; font-weight: 700; font-family: var(--font-mono); line-height: 1.2; }
.cost-sum-label { font-size: 7px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); margin-top: 1px; }
.cost-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
.cost-info { display: flex; align-items: center; gap: 5px; min-width: 90px; flex-shrink: 0; }
.cost-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
.cost-name { font-size: 10px; font-family: var(--font-mono); color: var(--text-secondary); }
.cost-bar-track { flex: 1; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.03); overflow: hidden; }
.cost-bar-fill { height: 100%; border-radius: 3px; transition: width 0.6s var(--ease-out); }
.cost-value { font-size: 10px; font-family: var(--font-mono); font-weight: 600; color: var(--neon-orange); min-width: 44px; text-align: right; }

/* ── TOOL BAR ── */
.tool-bar { display: flex; gap: 6px; padding: 5px 16px; height: 34px; align-items: center; background: rgba(8,8,14,0.9); border-top: 1px solid var(--border-dim); position: relative; z-index: 10; overflow-x: auto; }
.tool-chip { display: flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-family: var(--font-mono); letter-spacing: 0.5px; white-space: nowrap; border: 1px solid var(--border-dim); background: rgba(255,255,255,0.02); transition: all 0.2s; }
.tool-chip .dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
.tool-chip.active { border-color: rgba(255,255,255,0.1); }
.tool-chip.active .dot { box-shadow: 0 0 4px currentColor; }
.tool-chip.idle { opacity: 0.4; }
.tool-chip .chip-value { color: var(--text-secondary); }

/* ── TOOLTIP ── */
.tooltip { position: fixed; pointer-events: none; background: rgba(8,8,16,0.96); border: 1px solid var(--border-subtle); border-radius: 8px; padding: 10px 14px; font-size: 11px; font-family: var(--font-mono); color: var(--text-primary); z-index: 1000; opacity: 0; transition: opacity 0.12s; max-width: 260px; box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 1px rgba(0,255,245,0.2); backdrop-filter: blur(12px); }
.tooltip.visible { opacity: 1; }
.tooltip-title { font-weight: 700; font-size: 12px; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.tooltip-row { display: flex; justify-content: space-between; gap: 16px; padding: 2px 0; color: var(--text-secondary); font-size: 10px; }
.tooltip-row .val { color: var(--neon-cyan); font-weight: 600; }

/* ── GRAPH SVG ── */
.node-label { font-family: var(--font-mono); font-size: 10px; fill: var(--text-dim); pointer-events: none; text-anchor: middle; }
.node-label-bright { fill: var(--text-secondary); font-size: 11px; font-weight: 600; }
.node-label-center { font-size: 12px; font-weight: 700; fill: var(--text-primary); }
.edge-path { fill: none; transition: stroke-opacity 0.2s; }
.edge-path.highlighted { stroke-opacity: 0.7 !important; }
.edge-path.dimmed { stroke-opacity: 0.03 !important; }
.edge-label { font-family: var(--font-mono); font-size: 8px; fill: var(--text-dim); pointer-events: none; transition: opacity 0.2s; }
.particle { pointer-events: none; }
.ring-pulse { animation: ring-breathe 3s ease-in-out infinite; }
@keyframes ring-breathe { 0%,100% { opacity: 0.15; } 50% { opacity: 0.35; } }

/* ── DRAWER ── */
.drawer { position: fixed; bottom: 0; left: 0; right: 0; z-index: 200; border-radius: var(--panel-radius) var(--panel-radius) 0 0; max-height: 80vh; transition: transform 0.4s cubic-bezier(0.4,0,0.2,1); }
.drawer.collapsed { transform: translateY(calc(100% - 42px)); }
.drawer.fullscreen { max-height: 100vh; top: 0; border-radius: 0; z-index: 300; }
.drawer.fullscreen .drawer-body { max-height: calc(100vh - 42px); }
.drawer-handle { display: flex; align-items: center; justify-content: space-between; padding: 10px 20px; cursor: pointer; user-select: none; border-bottom: 1px solid var(--border-dim); }
.drawer-handle:hover { background: var(--bg-hover); }
.drawer-handle-left { display: flex; align-items: center; gap: 8px; }
.drawer-icon { color: var(--neon-cyan); filter: drop-shadow(0 0 4px var(--neon-cyan)); font-size: 14px; }
.drawer-title { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
.drawer-chevron { font-size: 10px; color: var(--text-dim); transition: transform 0.3s; }
.drawer.collapsed .drawer-chevron { transform: rotate(180deg); }
.drawer-controls { display: flex; align-items: center; gap: 12px; }
.drawer-fullscreen-btn { font-size: 14px; color: var(--text-dim); cursor: pointer; transition: color 0.2s; line-height: 1; }
.drawer-fullscreen-btn:hover { color: var(--neon-cyan); }
.drawer-body { padding: 20px 24px; overflow-y: auto; max-height: calc(80vh - 42px); }


@keyframes fade-slide-in { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }

/* ── GitHub corner ── */
/* ── Score ── */
.score-container { display: flex; align-items: center; gap: 24px; margin-bottom: 20px; }
.score-circle { width: 90px; height: 90px; position: relative; flex-shrink: 0; }
.score-circle svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.score-circle .bg { fill: none; stroke: rgba(255,255,255,0.04); stroke-width: 5; }
.score-circle .progress { fill: none; stroke-width: 5; stroke-linecap: round; transition: stroke-dashoffset 1.2s var(--ease-out); filter: drop-shadow(0 0 6px currentColor); }
.score-number { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; font-family: var(--font-mono); }
.score-label { font-size: 10px; color: var(--text-dim); letter-spacing: 0.5px; line-height: 1.5; }
/* ── Dev Profile ── */
.dev-profile-section { background: linear-gradient(135deg, rgba(0,255,245,0.04), rgba(255,107,0,0.04)); border: 1px solid rgba(0,255,245,0.15); border-radius: 8px; padding: 16px 20px; margin-bottom: 20px; }
.dev-profile-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.dev-profile-icon { font-size: 22px; }
.dev-profile-title { font-size: 16px; font-weight: 700; color: var(--neon-cyan); text-shadow: 0 0 8px rgba(0,255,245,0.3); }
.dev-profile-bio { font-size: 12px; color: var(--text-secondary); line-height: 1.6; margin: 0 0 10px 0; }
.dev-profile-traits { display: flex; flex-wrap: wrap; gap: 6px; }
.trait-chip { font-size: 10px; font-family: var(--font-mono); padding: 3px 8px; border-radius: 4px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); color: var(--text-secondary); letter-spacing: 0.3px; }
/* ── Context Engineering ── */
.context-eng-section { margin-bottom: 20px; }
.context-eng-section h3, .anti-patterns-section h3, .session-deep-section h3, .cost-forensics-section h3, .prompt-analysis-section h3, .recommendations-section h3, .missing-section h3, .strengths-section h3, .project-insights-section h3, .workflow-section h3 { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: var(--text-dim); margin-bottom: 10px; }
.ce-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.ce-stat { text-align: center; padding: 12px 8px; border-radius: 6px; background: rgba(255,255,255,0.02); border: 1px solid var(--border-dim); }
.ce-value { font-size: 16px; font-weight: 700; font-family: var(--font-mono); color: var(--neon-cyan); margin-bottom: 4px; }
.ce-value small { font-size: 11px; font-weight: 400; }
.ce-label { font-size: 8px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); }
/* ── Anti-Patterns ── */
.anti-patterns-section { margin-bottom: 20px; }
.ap-card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); border-left: 3px solid var(--neon-yellow); border-radius: 6px; padding: 12px 14px; margin-bottom: 8px; }
.ap-card.high { border-left-color: var(--neon-red); }
.ap-card.medium { border-left-color: var(--neon-yellow); }

/* ═══════════════════════════════════════════════════════════
   HELPERS
   ═══════════════════════════════════════════════════════════ */
function formatNum(n) {
  if (n == null) return '0';
  if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return n.toLocaleString();
}
function formatCost(n) {
  if (n == null || n === 0) return '$0';
  if (n >= 1000) return '$' + (n / 1000).toFixed(1) + 'K';
  if (n >= 1) return '$' + n.toFixed(2);
  return '$' + n.toFixed(3);
}

function drawSparkline(id, data, color) {
  const el = document.getElementById(id);
  if (!el) return;
  const w = 56, h = 14, max = Math.max(...data, 1);
  const line = d3.line().x((_, i) => (i / (data.length - 1)) * w).y(d => h - 1 - (d / max) * (h - 3)).curve(d3.curveBasis);
  const svg = d3.select(`#${id}`).attr('viewBox', `0 0 ${w} ${h}`);
  svg.selectAll('*').remove();
  svg.append('path').attr('d', line(data)).style('stroke', color);
}

/* ═══════════════════════════════════════════════════════════
   PANELS
   ═══════════════════════════════════════════════════════════ */
function renderModels() {
  const MODEL_COLORS = { opus: '#ff6b00', sonnet: '#ff9944', haiku: '#ffcc88', gpt4o: '#00ff88' };
  const MODEL_PRICING = { opus: { input: 15, output: 75, cache: 1.875 }, sonnet: { input: 3, output: 15, cache: 0.30 }, haiku: { input: 0.80, output: 4, cache: 0.08 }, gpt4o: { input: 2.5, output: 10, cache: 0.5 } };
  const getFamily = id => { if (id.includes('opus')) return 'opus'; if (id.includes('sonnet')) return 'sonnet'; if (id.includes('haiku')) return 'haiku'; return 'gpt4o'; };
  const getName = id => { if (id.includes('opus')) return 'Opus 4.6'; if (id.includes('sonnet')) return 'Sonnet 4.6'; if (id.includes('haiku')) return 'Haiku 4.5'; return 'GPT-4o'; };

  const models = Object.entries(DEMO_MODELS).map(([id, u]) => {
    const fam = getFamily(id);
    const p = MODEL_PRICING[fam];
    const input = u.inputTokens, output = u.outputTokens, cache = u.cacheReadInputTokens;
    const total = input + output + cache;
    const cost = (input * p.input + output * p.output + cache * p.cache) / 1e6;
    return { name: getName(id), input, output, cache, total, cost, color: MODEL_COLORS[fam] };
  }).sort((a, b) => b.total - a.total);

  const maxTotal = Math.max(...models.map(m => m.total), 1);
  document.getElementById('model-content').innerHTML = models.map(m => {
    const iPct = (m.input / maxTotal * 100).toFixed(2);
    const oPct = (m.output / maxTotal * 100).toFixed(2);
    const cPct = (m.cache / maxTotal * 100).toFixed(2);
    return `<div class="model-row"><div class="model-info">
      <span class="model-name" style="color:${m.color}">${m.name}</span>
      <span class="model-stats"><span class="model-tokens">${formatNum(m.total)}</span><span class="model-cost">${formatCost(m.cost)}</span></span>
    </div><div class="model-bar-track">
      <div class="model-seg seg-input" style="width:${iPct}%"></div>
      <div class="model-seg seg-output" style="width:${oPct}%"></div>
      <div class="model-seg seg-cache" style="width:${cPct}%"></div>
    </div></div>`;
  }).join('');
}

  document.getElementById('hourly-content').innerHTML = `<div class="hourly-chart">${hours.map(h => {
    const pct = Math.max((h.count / max * 100), 2);
    const isNow = h.hour === now;
    const opacity = 0.25 + (h.count / max) * 0.75;
    const showLabel = h.hour % 4 === 0;

  }).join('')}</div>`;
}

  cg.append('stop').attr('offset', '0%').attr('stop-color', 'rgba(255,255,255,0.15)');
  cg.append('stop').attr('offset', '100%').attr('stop-color', 'rgba(255,255,255,0)');

  ['#ff6b00','#00fff5','#00ff88','#6644ff','#ff9944','#ffcc88','#4488ff','#ffffff','#ffee00','#ff00ff','#ff4444'].forEach(color => {
    defs.append('marker').attr('id', `arrow-${color.replace('#', '')}`).attr('viewBox', '0 0 10 6').attr('refX', 10).attr('refY', 3).attr('markerWidth', 8).attr('markerHeight', 5).attr('orient', 'auto')
      .append('path').attr('d', 'M0,0 L10,3 L0,6').attr('fill', color).attr('opacity', 0.4);
  });

  const container = svg.append('g');
  svg.call(d3.zoom().scaleExtent([0.2, 5]).on('zoom', e => container.attr('transform', e.transform)));

  const nodeMap = new Map(data.nodes.map(n => [n.id, { ...n }]));
  const nodes = Array.from(nodeMap.values());
  const edges = data.edges.filter(e => nodeMap.has(e.source) && nodeMap.has(e.target)).map(e => ({ ...e }));

  const maxVal = Math.max(...nodes.map(n => n.value || 1), 1);
  const logScale = v => Math.log2((v || 1) + 1) / Math.log2(maxVal + 1);
  const nodeRadius = n => {
    if (n.type === 'center') return 28;
    if (n.type === 'tool') return 14 + logScale(n.value) * 20;
    if (n.type === 'model') return 10 + logScale(n.value) * 14;
    if (n.type === 'metric') return 12 + logScale(n.value) * 10;
    if (n.type === 'feature') return 8 + logScale(n.value) * 10;
    return 6 + logScale(n.value) * 10;
  };

  const layerX = { 0: W * 0.08, 1: W * 0.30, 2: W * 0.58, 3: W * 0.85 };

  const simulation = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(edges).id(d => d.id).distance(d => {
      const sl = typeof d.source === 'object' ? (d.source.layer || 0) : 0;
      const tl = typeof d.target === 'object' ? (d.target.layer || 0) : 0;
      const gap = Math.abs(sl - tl);
      return gap === 0 ? 60 : gap === 1 ? 150 : 250;
    }).strength(0.15))
    .force('x', d3.forceX().x(d => layerX[d.layer] || W * 0.5).strength(1.2))
    .force('y', d3.forceY().y(H / 2).strength(0.04))
    .force('collide', d3.forceCollide().radius(d => nodeRadius(d) + 20))
    .velocityDecay(0.45);

  const edgeGroup = container.append('g');
  const edgePaths = edgeGroup.selectAll('path').data(edges).join('path')
    .attr('stroke', d => { const src = typeof d.source === 'object' ? d.source : nodeMap.get(d.source); return src?.color || '#333'; })
    .attr('stroke-width', d => { const base = d.edgeType === 'token_flow' ? 1.5 : 0.8; return base + logScale(d.value) * 3; })
    .attr('stroke-dasharray', d => (EDGE_STYLES[d.edgeType] || {}).dash || 'none')
    .attr('stroke-opacity', d => (EDGE_STYLES[d.edgeType] || {}).opacity || 0.2)
    .attr('marker-end', d => { const src = typeof d.source === 'object' ? d.source : nodeMap.get(d.source); return `url(#arrow-${(src?.color || '#333').replace('#', '')})`; });

  const edgeLabelGroup = container.append('g');
  const edgeLabels = edgeLabelGroup.selectAll('text').data(edges).join('text').attr('class', 'edge-label').attr('text-anchor', 'middle').attr('dy', -4).text(d => d.label || '').style('opacity', 0);

  const particleGroup = container.append('g');
  const nodeGroup = container.append('g');
  const nodeEls = nodeGroup.selectAll('g').data(nodes).join('g').attr('class', d => `node node-${d.type}`).style('cursor', 'pointer')
    .call(d3.drag()
      .on('start', (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = layerX[d.layer] || d.x; d.fy = d.y; })
      .on('drag', (e, d) => { d.fx = layerX[d.layer] || d.x; d.fy = e.y; })
      .on('end', (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; })
    );

  nodeEls.each(function(d) {
    const g = d3.select(this), r = nodeRadius(d);
    if (d.type === 'center') {
      g.append('circle').attr('r', r + 20).attr('fill', 'url(#center-grad)').attr('opacity', 0.5);
      g.append('circle').attr('r', r + 8).attr('fill', 'none').attr('stroke', '#fff').attr('stroke-width', 0.5).attr('opacity', 0.2).attr('class', 'ring-pulse');
      g.append('circle').attr('r', r).attr('fill', 'rgba(255,255,255,0.04)').attr('stroke', '#fff').attr('stroke-width', 1.5).attr('filter', 'url(#glow-strong)');
      g.append('text').attr('class', 'node-label node-label-center').attr('dy', 4).text(d.label);
    } else if (d.type === 'tool') {
      g.append('circle').attr('r', r + 4).attr('fill', 'none').attr('stroke', d.color).attr('stroke-width', 0.5).attr('opacity', d.status === 'active' ? 0.3 : 0.1).attr('stroke-dasharray', d.status === 'active' ? 'none' : '2,3');
      g.append('circle').attr('r', r).attr('fill', d.color + '15').attr('stroke', d.color).attr('stroke-width', 1.5).attr('filter', 'url(#glow)');
      g.append('text').attr('text-anchor', 'middle').attr('dy', 5).attr('font-size', Math.max(10, r * 0.7)).attr('font-weight', '700').attr('font-family', "'SF Mono', monospace").attr('fill', d.color).text(d.label[0]);
      g.append('text').attr('class', 'node-label node-label-bright').attr('dy', r + 14).text(d.label);
      const sub = d.tokens > 0 ? formatNum(d.tokens) + ' tok' : '';
      if (sub) g.append('text').attr('class', 'node-label').attr('dy', r + 24).attr('font-size', '8px').attr('fill', d.color).attr('opacity', 0.6).text(sub);
    } else if (d.type === 'model') {
      const pts = d3.range(6).map(i => { const a = (i * 60 - 30) * Math.PI / 180; return [Math.cos(a) * r, Math.sin(a) * r]; });
      g.append('polygon').attr('points', pts.map(p => p.join(',')).join(' ')).attr('fill', d.color + '12').attr('stroke', d.color).attr('stroke-width', 1.2).attr('filter', 'url(#glow-soft)');
      g.append('text').attr('class', 'node-label node-label-bright').attr('dy', r + 13).text(d.label);
    } else if (d.type === 'project') {
      const s = r;
      g.append('polygon').attr('points', `0,${-s} ${s},0 0,${s} ${-s},0`).attr('fill', d.color + '12').attr('stroke', d.color).attr('stroke-width', 1).attr('filter', 'url(#glow-soft)');
      g.append('text').attr('class', 'node-label').attr('dy', r + 12).attr('font-size', '9px').text(d.label);
    } else if (d.type === 'feature') {
      g.append('rect').attr('x', -r * 1.3).attr('y', -r * 0.7).attr('width', r * 2.6).attr('height', r * 1.4).attr('rx', 4).attr('fill', d.color + '10').attr('stroke', d.color).attr('stroke-width', 1).attr('filter', 'url(#glow-soft)');
      g.append('text').attr('class', 'node-label node-label-bright').attr('dy', 3).attr('font-size', '9px').text(d.label);
      if (d.count) g.append('text').attr('class', 'node-label').attr('dy', r * 0.7 + 12).attr('font-size', '8px').attr('fill', d.color).attr('opacity', 0.6).text(d.count.toLocaleString());
    } else if (d.type === 'metric') {
      const s = r * 0.9;
      g.append('rect').attr('x', -s).attr('y', -s).attr('width', s * 2).attr('height', s * 2).attr('rx', 5).attr('fill', d.color + '12').attr('stroke', d.color).attr('stroke-width', 1.2).attr('filter', 'url(#glow-soft)');
      g.append('text').attr('class', 'node-label node-label-bright').attr('dy', 3).attr('font-size', '9px').text(d.label);
      if (d.ai_pct != null) {
        const bw = s * 1.4, bh = 3, aiW = bw * (d.ai_pct / 100);
        g.append('rect').attr('x', -bw / 2).attr('y', s + 6).attr('width', bw).attr('height', bh).attr('rx', 1).attr('fill', 'rgba(255,255,255,0.06)');
        g.append('rect').attr('x', -bw / 2).attr('y', s + 6).attr('width', aiW).attr('height', bh).attr('rx', 1).attr('fill', d.color);
      }
    }
  });

  // Tooltip
  const tooltip = document.getElementById('tooltip');
  nodeEls.on('click', (event, d) => {
    event.stopPropagation();
    edgePaths.each(function(e) {
      const sid = typeof e.source === 'object' ? e.source.id : e.source;
      const tid = typeof e.target === 'object' ? e.target.id : e.target;
      const connected = sid === d.id || tid === d.id;
      d3.select(this).classed('highlighted', connected).classed('dimmed', !connected);
    });
    edgeLabels.each(function(e) {
      const sid = typeof e.source === 'object' ? e.source.id : e.source;
      const tid = typeof e.target === 'object' ? e.target.id : e.target;
      d3.select(this).style('opacity', (sid === d.id || tid === d.id) ? 0.7 : 0);
    });
  });
  svg.on('click', () => { edgePaths.classed('highlighted', false).classed('dimmed', false); edgeLabels.style('opacity', 0); });

  nodeEls.on('mouseenter', (event, d) => {
    let html = `<div class="tooltip-title" style="color:${d.color}"><span>${d.label}</span></div>`;
    html += `<div class="tooltip-row"><span>Type</span><span class="val">${d.type}</span></div>`;
    if (d.value) html += `<div class="tooltip-row"><span>Activity</span><span class="val">${formatNum(d.value)}</span></div>`;
    if (d.tokens > 0) html += `<div class="tooltip-row"><span>Tokens</span><span class="val">${formatNum(d.tokens)}</span></div>`;
    if (d.messages > 0) html += `<div class="tooltip-row"><span>Messages</span><span class="val">${formatNum(d.messages)}</span></div>`;
    if (d.sessions > 0) html += `<div class="tooltip-row"><span>Sessions</span><span class="val">${d.sessions}</span></div>`;
    if (d.cost) html += `<div class="tooltip-row"><span>Cost</span><span class="val">${formatCost(d.cost)}</span></div>`;
    if (d.count) html += `<div class="tooltip-row"><span>Count</span><span class="val">${d.count.toLocaleString()}</span></div>`;
    if (d.ai_lines != null) {
      html += `<div class="tooltip-row"><span>AI Lines</span><span class="val">${d.ai_lines.toLocaleString()}</span></div>`;
      html += `<div class="tooltip-row"><span>Human Lines</span><span class="val">${d.human_lines.toLocaleString()}</span></div>`;
    }
    if (d.cacheRead && d.inputTokens) {
      const rate = ((d.cacheRead / (d.cacheRead + d.inputTokens)) * 100).toFixed(1);
      html += `<div class="tooltip-row"><span>Cache Hit</span><span class="val">${rate}%</span></div>`;
    }
    tooltip.innerHTML = html;
    tooltip.classList.add('visible');
  });
  nodeEls.on('mousemove', event => { tooltip.style.left = (event.clientX + 12) + 'px'; tooltip.style.top = (event.clientY - 12) + 'px'; });
  nodeEls.on('mouseleave', () => tooltip.classList.remove('visible'));

  // Tick
  simulation.on('tick', () => {
    edgePaths.attr('d', d => {
      const sx = d.source.x, sy = d.source.y, tx = d.target.x, ty = d.target.y;
      return `M${sx},${sy} C${(sx + tx) / 2},${sy} ${(sx + tx) / 2},${ty} ${tx},${ty}`;
    });
    edgeLabels.attr('x', d => (d.source.x + d.target.x) / 2).attr('y', d => (d.source.y + d.target.y) / 2);
    nodeEls.attr('transform', d => `translate(${d.x},${d.y})`);
  });

  // Particles
  const particleEdges = edges.filter(e => (EDGE_STYLES[e.edgeType] || {}).particleColor);
  if (particleEdges.length) {
    const totalVal = particleEdges.reduce((s, e) => s + (e.value || 1), 0);
    setInterval(() => {
      let r = Math.random() * totalVal, edge = particleEdges[0];
      for (const e of particleEdges) { r -= (e.value || 1); if (r <= 0) { edge = e; break; } }
      const src = edge.source, tgt = edge.target;
      if (!src?.x || !tgt?.x) return;
      const color = (EDGE_STYLES[edge.edgeType] || {}).particleColor || '#00fff5';
      const p = particleGroup.append('circle').attr('class', 'particle').attr('r', 1.5 + Math.random()).attr('fill', color).attr('filter', 'url(#glow-soft)').attr('cx', src.x).attr('cy', src.y).attr('opacity', 0.7);
      const midX = (src.x + tgt.x) / 2, dur = 1200 + Math.random() * 800;
      const timer = d3.timer(elapsed => {
        const t = Math.min(elapsed / dur, 1), q = 1 - t;
        p.attr('cx', q*q*q*src.x + 3*q*q*t*midX + 3*q*t*t*midX + t*t*t*tgt.x)
         .attr('cy', q*q*q*src.y + 3*q*q*t*src.y + 3*q*t*t*tgt.y + t*t*t*tgt.y)
         .attr('opacity', 0.7 * (1 - t * 0.6));
        if (t >= 1) { p.remove(); timer.stop(); }
      });
    }, 180);
  }

  // Legend
  document.getElementById('graph-legend').innerHTML = `
    <div class="legend-item"><span class="legend-shape legend-circle" style="background:rgba(255,255,255,0.6);border-color:rgba(255,255,255,0.6)"></span>You</div>
    <div class="legend-item"><span class="legend-shape legend-circle" style="background:rgba(255,107,0,0.3);border-color:#ff6b00"></span>Tool</div>
    <div class="legend-item"><span class="legend-shape legend-hex" style="background:rgba(255,153,68,0.3);border-color:#ff9944"></span>Model</div>
    <div class="legend-item"><span class="legend-shape legend-diamond" style="background:rgba(102,68,255,0.3);border-color:#6644ff"></span>Project</div>
    <div class="legend-item"><span class="legend-shape legend-rect" style="background:rgba(0,255,245,0.3);border-color:#00fff5"></span>Feature</div>
    <div class="legend-item"><span class="legend-shape legend-rect" style="background:rgba(0,255,136,0.3);border-color:#00ff88"></span>Metric</div>
  `;
}

                     score >= 60 ? 'var(--neon-cyan)' :
                     score >= 40 ? 'var(--neon-yellow)' : 'var(--neon-red)';

                      data.source === 'partial' ? 'Data-Driven Metrics' : 'Analysis';
  html += `
    <div class="score-container">
      <div class="score-circle">
        <svg viewBox="0 0 100 100">
          <circle class="bg" cx="50" cy="50" r="42" />
          <circle class="progress" cx="50" cy="50" r="42"
            stroke="${scoreColor}"
            stroke-dasharray="${circumference}"
            stroke-dashoffset="${offset}" />
        </svg>
        <div class="score-number" style="color:${scoreColor}">${score}</div>
      </div>
      <div>
        <div style="font-size:20px;font-weight:700;margin-bottom:4px;">
          ${score >= 80 ? 'Excellent' : score >= 60 ? 'Good' : score >= 40 ? 'Needs Work' : 'Poor'} Usage
        </div>
        <div class="score-label">${sourceLabel}</div>
  `;
  const ps = data.profile_summary;
  if (ps) {
    html += `<div style="display:flex;gap:16px;margin-top:8px;font-size:11px;color:var(--text-secondary);">
      <span>${formatNum(ps.total_tokens)} tokens</span>
      <span>$${(ps.total_cost || 0).toFixed(2)} cost</span>
      <span>${ps.session_count} sessions</span>
      <span>${ps.active_tools} tools</span>
      ${ps.cache_hit_rate ? `<span>${ps.cache_hit_rate}% cache</span>` : ''}
    </div>`;
  }
  html += `</div></div>`;

  // Developer profile / bio
  const dp = data.developer_profile;
  if (dp && dp.title) {
    const personalityIcons = {
      'power_user': '\u26A1', 'debug_warrior': '\uD83D\uDEE1\uFE0F',
      'explorer': '\uD83E\uDDED', 'methodical_builder': '\uD83C\uDFD7\uFE0F',
      'cautious_adopter': '\uD83C\uDFAF', 'efficiency_optimizer': '\u2699\uFE0F',
    };
    const icon = personalityIcons[dp.ai_personality] || '\uD83D\uDC64';
    html += `
      <div class="dev-profile-section">
        <div class="dev-profile-header">
          <span class="dev-profile-icon">${icon}</span>
          <span class="dev-profile-title">${dp.title}</span>
        </div>
        <p class="dev-profile-bio">${dp.bio}</p>
        ${dp.traits && dp.traits.length > 0 ? `
          <div class="dev-profile-traits">
            ${dp.traits.map(t => `<span class="trait-chip">${t}</span>`).join('')}
          </div>
        ` : ''}
      </div>
    `;
  }

  // Context engineering card
  const ce = data.context_engineering;
  if (ce && ce.total_messages > 0) {
    const bloatColor = ce.bloated_pct > 30 ? 'var(--neon-red)' : ce.bloated_pct > 10 ? 'var(--neon-yellow)' : 'var(--neon-green)';
    const cpmColor = ce.cost_per_message > 0.05 ? 'var(--neon-red)' : ce.cost_per_message > 0.01 ? 'var(--neon-yellow)' : 'var(--neon-green)';
    html += `
      <div class="context-eng-section">
        <h3>Context Engineering</h3>
        <div class="ce-grid">
          <div class="ce-stat">
            <div class="ce-value">${formatNum(ce.avg_tokens_per_message)}</div>
            <div class="ce-label">Tokens / Message</div>
          </div>
          <div class="ce-stat">
            <div class="ce-value">${ce.avg_tool_calls_per_session}</div>
            <div class="ce-label">Tool Calls / Session</div>
          </div>
          <div class="ce-stat">
            <div class="ce-value" style="color:${bloatColor}">${ce.bloated_sessions} <small>(${ce.bloated_pct}%)</small></div>
            <div class="ce-label">Bloated Sessions (&gt;50 msgs)</div>
          </div>
          <div class="ce-stat">
            <div class="ce-value" style="color:${cpmColor}">$${ce.cost_per_message.toFixed(4)}</div>
            <div class="ce-label">Cost / Message</div>
          </div>
        </div>
      </div>
    `;
  }

  // Anti-patterns section
  const aps = data.anti_patterns;
  if (aps && aps.length > 0) {
    html += '<div class="anti-patterns-section"><h3>Detected Anti-Patterns</h3>';
    aps.forEach(ap => {
      const sev = (ap.severity || 'medium').toLowerCase();
      html += `
        <div class="ap-card ${sev}">
          <div class="ap-header">
            <span class="ap-icon">${ap.icon || '\u26A0\uFE0F'}</span>
            <span class="ap-name">${ap.pattern}</span>
            <span class="ap-severity ${sev}">${sev}</span>
            <span class="ap-count">${ap.count}x</span>
          </div>
          <div class="ap-detail">${ap.detail}</div>
          <div class="ap-fix">${ap.fix}</div>
          ${ap.examples && ap.examples.length > 0 ? `
            <div class="ap-examples">
              ${ap.examples.map(e => `<div class="ap-example">${e}</div>`).join('')}
            </div>
          ` : ''}
        </div>
      `;
    });
    html += '</div>';
  }

  // Session deep-dive
  const sd = data.session_details;
  if (sd && sd.length > 0) {
    html += '<div class="session-deep-section"><h3>Top Sessions (by token usage)</h3>';
    const intentIcons = {
      'debugging': '\uD83D\uDC1B', 'greenfield': '\uD83C\uDFD7\uFE0F', 'refactoring': '\u267B\uFE0F',
      'exploration': '\uD83D\uDD0D', 'devops': '\u2699\uFE0F', 'documentation': '\uD83D\uDCDD',
      'code_review': '\uD83D\uDC41\uFE0F', 'other': '\uD83D\uDCE6',
    };
    sd.slice(0, 8).forEach(s => {
      const icon = intentIcons[s.intent] || '\uD83D\uDCE6';
      const msgClass = s.messages > 50 ? 'warn' : s.messages > 20 ? 'mid' : 'ok';
      html += `
        <div class="sd-card" onclick="this.classList.toggle('expanded')">
          <div class="sd-header">
            <span class="sd-icon">${icon}</span>
            <span class="sd-project">${s.project}</span>
            <span class="sd-intent">${s.intent}</span>
            <span class="sd-tool">${s.tool}</span>
          </div>
          <div class="sd-metrics">
            <span class="sd-metric ${msgClass}">${s.messages} msgs</span>
            <span class="sd-metric">${formatNum(s.tokens)} tok</span>
            <span class="sd-metric">$${s.cost.toFixed(2)}</span>
            <span class="sd-metric">${s.context_ratio}x ctx</span>
          </div>
          ${s.first_prompt ? `<div class="sd-prompt">"${s.first_prompt}"</div>` : ''}
        </div>
      `;
    });
    html += '</div>';
  }

  // Cost forensics section
  const cf = data.cost_forensics;
  if (cf && cf.total_cost > 0) {
    const wasteColor = cf.waste_pct > 15 ? 'var(--neon-red)' : cf.waste_pct > 5 ? 'var(--neon-yellow)' : 'var(--neon-green)';
    html += `
      <div class="cost-forensics-section">
        <h3>Cost Forensics</h3>
        <div class="cf-summary">
          <div class="cf-stat">
            <div class="cf-value">$${cf.total_cost.toFixed(2)}</div>
            <div class="cf-label">Total Spend</div>
          </div>
          <div class="cf-stat">
            <div class="cf-value" style="color:${wasteColor}">$${cf.estimated_waste.toFixed(2)}</div>
            <div class="cf-label">Estimated Waste</div>
          </div>
          <div class="cf-stat">
            <div class="cf-value" style="color:${wasteColor}">${cf.waste_pct}%</div>
            <div class="cf-label">Waste Rate</div>
          </div>
        </div>
    `;
    const cbp = cf.cost_by_project || [];
    if (cbp.length > 0) {
      const maxCost = cbp[0].cost || 1;
      html += '<div class="cf-projects">';
      cbp.slice(0, 6).forEach(p => {
        const pct = Math.round((p.cost / maxCost) * 100);
        html += `
          <div class="cf-bar-row">
            <span class="cf-bar-label">${p.project}</span>
            <div class="cf-bar-track"><div class="cf-bar-fill" style="width:${pct}%"></div></div>
            <span class="cf-bar-value">$${p.cost.toFixed(2)}</span>
          </div>
        `;
      });
      html += '</div>';
    }
    const cbm = cf.cost_by_model || [];
    if (cbm.length > 0) {
      html += '<div class="cf-models">';
      cbm.forEach(m => {
        html += `
          <div class="cf-model-row">
            <span class="cf-model-name">${m.model}</span>
            <span class="cf-model-cost">$${m.cost.toFixed(2)}</span>
            <span class="cf-model-tokens">${formatNum(m.tokens)} tok</span>
          </div>
        `;
      });
      html += '</div>';
    }
    if (cf.estimated_waste > 1) {
      html += `<div class="cf-saving">Reducing marathon sessions could save ~$${cf.estimated_waste.toFixed(2)}/period</div>`;
    }
    html += '</div>';
  }

  // Prompt intelligence section
  const pa = data.prompt_analysis;
  if (pa && pa.prompt_length_distribution) {
    const pld = pa.prompt_length_distribution;
    const total = (pld.commands_under_20 || 0) + (pld.short_20_100 || 0) + (pld.detailed_100_500 || 0) + (pld.very_detailed_500_plus || 0);
    const specColor = pa.specificity_score >= 60 ? 'var(--neon-green)' : pa.specificity_score >= 30 ? 'var(--neon-yellow)' : 'var(--neon-red)';
    html += `
      <div class="prompt-analysis-section">
        <h3>Prompt Intelligence</h3>
        <div class="pa-grid">
          <div class="pa-stat">
            <div class="pa-value" style="color:${specColor}">${pa.specificity_score}%</div>
            <div class="pa-label">Specificity Score</div>
          </div>
          <div class="pa-stat">
            <div class="pa-value">${pld.avg_length}</div>
            <div class="pa-label">Avg Length (chars)</div>
          </div>
          <div class="pa-stat">
            <div class="pa-value">${pld.detailed_100_500 + pld.very_detailed_500_plus}</div>
            <div class="pa-label">Detailed Prompts</div>
          </div>
        </div>
    `;
    if (total > 0) {
      const cmdPct = (pld.commands_under_20 / total * 100).toFixed(1);
      const shortPct = (pld.short_20_100 / total * 100).toFixed(1);
      const detPct = (pld.detailed_100_500 / total * 100).toFixed(1);
      const richPct = (pld.very_detailed_500_plus / total * 100).toFixed(1);
      html += `
        <div class="pa-bar">
          <div class="pa-segment cmd" style="width:${cmdPct}%" title="Commands: ${pld.commands_under_20}"></div>
          <div class="pa-segment short" style="width:${shortPct}%" title="Short: ${pld.short_20_100}"></div>
          <div class="pa-segment detailed" style="width:${detPct}%" title="Detailed: ${pld.detailed_100_500}"></div>
          <div class="pa-segment rich" style="width:${richPct}%" title="Rich: ${pld.very_detailed_500_plus}"></div>
        </div>
        <div class="pa-legend">
          <span class="pa-legend-item"><span class="pa-dot cmd"></span> Commands (&lt;20)</span>
          <span class="pa-legend-item"><span class="pa-dot short"></span> Short (20-100)</span>
          <span class="pa-legend-item"><span class="pa-dot detailed"></span> Detailed (100-500)</span>
          <span class="pa-legend-item"><span class="pa-dot rich"></span> Rich (500+)</span>
        </div>
      `;
    }
    const sc = pa.slash_commands || {};
    const scKeys = Object.keys(sc);
    if (scKeys.length > 0) {
      html += '<div class="pa-commands">';
      scKeys.forEach(cmd => {
        html += `<span class="pa-command">${cmd} <small>${sc[cmd]}x</small></span>`;
      });
      html += '</div>';
    }
    html += '</div>';
  }

  // Grade cards
  if (data.grades && Object.keys(data.grades).length > 0) {
    html += '<div class="grades-grid">';
    const gradeNames = {
      cache_efficiency: 'Cache Efficiency', session_hygiene: 'Session Hygiene',
      model_selection: 'Model Selection', prompt_quality: 'Prompt Quality',
      tool_utilization: 'Tool Utilization',
    };
    for (const [key, info] of Object.entries(data.grades)) {
      const grade = info.grade || 'B';
      const gradeClass = ['A','B','C','D'].includes(grade) ? `grade-${grade}` : '';
      html += `
        <div class="grade-card ${gradeClass}">
          <div class="grade-letter">${grade}</div>
          <div class="grade-name">${gradeNames[key] || key}</div>
          <div class="grade-detail">${info.detail || ''}</div>
        </div>
      `;
    }
    html += '</div>';
  }

  // Strengths
  if (data.strengths && data.strengths.length > 0) {
    html += '<div class="strengths-section"><h3>What You\'re Doing Right</h3>';
    html += '<div class="strengths-grid">';
    data.strengths.forEach(s => {
      html += `
        <div class="strength-card">
          <span class="strength-icon">${s.icon || '\u2705'}</span>
          <div class="strength-body">
            <h4>${s.title}</h4>
            <p>${s.detail}</p>
          </div>
        </div>
      `;
    });
    html += '</div></div>';
  }

  // Recommendations
  if (data.recommendations && data.recommendations.length > 0) {
    html += '<div class="recommendations-section"><h3>Recommendations</h3>';
    data.recommendations.forEach(rec => {
      const priority = (rec.priority || 'medium').toLowerCase();
      html += `
        <div class="rec-card">
          <span class="rec-priority ${priority}">${priority}</span>
          <div class="rec-body">
            <h4>${rec.title}</h4>
            <p>${rec.description}</p>
            ${rec.savings ? `<div class="rec-savings">${rec.savings}</div>` : ''}
          </div>
        </div>
      `;
    });
    html += '</div>';
  }

  // Missing features
  if (data.missing_features && data.missing_features.length > 0) {
    html += '<div class="missing-section"><h3>Features You\'re Not Using</h3>';
    data.missing_features.forEach(f => {
      html += `
        <div class="missing-card">
          <div>
            <span class="tool-tag">${f.tool}</span>
            <span class="feature-name">${f.feature}</span>
          </div>
          ${f.evidence ? `<div class="feature-evidence">${f.evidence}</div>` : ''}
          <div class="feature-benefit">${f.benefit}</div>
        </div>
      `;
    });
    html += '</div>';
  }

  // Project insights
  if (data.project_insights && data.project_insights.length > 0) {
    html += '<div class="project-insights-section"><h3>Project Intelligence</h3>';
    data.project_insights.forEach(pi => {
      const typeBadges = {
        'greenfield': '\uD83C\uDFD7\uFE0F', 'debugging': '\uD83D\uDC1B', 'refactoring': '\u267B\uFE0F',
        'exploration': '\uD83D\uDD0D', 'devops': '\u2699\uFE0F', 'documentation': '\uD83D\uDCDD',
        'code_review': '\uD83D\uDC41\uFE0F', 'other': '\uD83D\uDCE6', 'general': '\uD83D\uDCE6',
      };
      const badge = typeBadges[pi.type] || '\uD83D\uDCE6';
      html += `
        <div class="project-insight-card">
          <div class="pi-header">
            <span class="pi-type">${badge}</span>
            <span class="pi-name">${pi.project}</span>
            <span class="pi-type-label">${pi.type}</span>
          </div>
          <div class="pi-stats">${pi.insight}</div>
          <div class="pi-rec">${pi.recommendation}</div>
          ${pi.recommended_model ? `<div class="pi-model-rec"><span class="pi-model-label">Recommended model:</span> <strong>${pi.recommended_model.model}</strong> \u2014 ${pi.recommended_model.reason}</div>` : ''}
          ${pi.recommended_tool ? `<div class="pi-model-rec"><span class="pi-model-label">Recommended IDE:</span> <strong>${pi.recommended_tool.tool}</strong> \u2014 ${pi.recommended_tool.reason}</div>` : ''}
          ${pi.underutilized && pi.underutilized !== 'None detected' ? `<div class="pi-underutil">Underutilized: ${pi.underutilized}</div>` : ''}
        </div>
      `;
    });
    html += '</div>';
  }

  // Workflow vision
  if (data.workflow && data.workflow.current) {
    html += `<div class="workflow-section">
      <h3>Workflow Assessment</h3>
      <div class="workflow-grid">
        <div class="workflow-col current">
          <div class="wf-label">Current Workflow</div>
          <p>${data.workflow.current}</p>
        </div>
        <div class="workflow-col future">
          <div class="wf-label">Optimized Workflow</div>
          <p>${data.workflow.future}</p>
        </div>
      </div>
    </div>`;
  }

  html += '</div>';
  content.innerHTML = html;
}

/* ═══════════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', () => {
  renderStats();
  renderToolBar();
  renderModels();
  renderHourly();
  renderSessions();
  renderCost();
  renderGraph();
  renderOptimizer();

  // Drawer toggle
  const drawer = document.getElementById('optimizer-drawer');
  const fsBtn = document.getElementById('drawer-fullscreen');
  document.getElementById('drawer-toggle').addEventListener('click', (e) => {
    if (e.target.closest('#drawer-fullscreen')) return;
    drawer.classList.toggle('collapsed');
    if (!drawer.classList.contains('collapsed')) drawer.classList.remove('fullscreen');
  });
  fsBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    drawer.classList.remove('collapsed');
    drawer.classList.toggle('fullscreen');
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (drawer.classList.contains('fullscreen')) { drawer.classList.remove('fullscreen'); }
      else if (!drawer.classList.contains('collapsed')) { drawer.classList.add('collapsed'); }
    }
  });
  // Auto-open drawer after 2s for demo wow-factor
  setTimeout(() => { drawer.classList.remove('collapsed'); }, 2000);

  // Live counter animation
  setInterval(() => {
    const el = document.getElementById('stat-tokens');
    if (!el) return;
    const bases = { tokens: 10224020, cost: 251.56, messages: 4192, sessions: 129 };
    const jitter = { tokens: Math.floor(Math.random() * 5000), cost: Math.random() * 0.5, messages: Math.floor(Math.random() * 3), sessions: 0 };
    el.textContent = formatNum(bases.tokens + jitter.tokens);
    el.style.transform = 'scale(1.12)';
    setTimeout(() => { el.style.transform = 'scale(1)'; }, 200);
    const cel = document.getElementById('stat-cost');
    if (cel) { cel.textContent = formatCost(bases.cost + jitter.cost); cel.style.transform = 'scale(1.12)'; setTimeout(() => { cel.style.transform = 'scale(1)'; }, 200); }
    const mel = document.getElementById('stat-messages');
    if (mel) { mel.textContent = formatNum(bases.messages + jitter.messages); }
  }, 3000);
});
</script>
</body>
</html>
